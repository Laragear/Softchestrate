name: Feature request
description: |
  Suggest a new agent, skill or improvement for this library.

  Sponsors get priority issues, PRs, fixes and requests. Not a sponsor? You're a just click away! https://github.com/sponsors/DarkGhostHunter.
title: "Add this cool agent, skill or feature"
labels: ["enhancement"]
assignees:
  - DarkGhostHunter
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to this library!
        New agents and skills keep it fresh and fun for everybody to use.

        Your features are accepted at the **sole discretion of the maintainer**.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what it does and when it should be used.
      placeholder: |
        This new agent/skill would accomplish...

        It should be used when...

        It should not be used when...

        And it would be cool because...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Example
      description: Sample a short task the agent or skill would handle, and the result you expect.
      placeholder: |
        "Upgrade the dependencies of this project" -> a plan, one bump per commit, tests green.
    validations:
      required: true
